name: "crypto_research_workbench"
version: "1.0.0"
config-version: 2

profile: "crypto_research_workbench"

model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  crypto_research_workbench:
    # Staging: thin SQL views over raw ClickHouse tables
    staging:
      +materialized: view
      +schema: staging

    # Marts: materialized tables consumed by dashboards and notebooks
    marts:
      +materialized: table
      +schema: marts

vars:
  # Default date range for incremental model runs (override at runtime)
  start_date: "2023-01-01"
  end_date: "{{ run_started_at.strftime('%Y-%m-%d') }}"

crypto_research_workbench:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: "{{ env_var('CLICKHOUSE_DB', 'crypto') }}"
      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      port: "{{ env_var('CLICKHOUSE_HTTP_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'crypto_user') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', '') }}"
      secure: False
      verify: False
      connect_timeout: 10
      send_receive_timeout: 300

# =============================================================================
# Crypto Research Workbench — docker-compose.yml
#
# Services:
#   postgres        — operational metadata DB (Airflow backend)
#   clickhouse      — primary analytical serving database
#   minio           — object storage (bronze / silver / gold)
#   minio-init      — one-shot bucket creation
#   kafka           — event backbone (KRaft, no ZooKeeper)
#   spark-master    — Spark cluster master
#   spark-worker    — Spark cluster worker
#   airflow-init    — DB migration + admin user creation (runs once)
#   airflow-webserver
#   airflow-scheduler
#   superset        — dashboarding / BI layer
#   app             — Python ingestion & processing jobs
#   dbt             — analytical modeling
# =============================================================================

# ---------------------------------------------------------------------------
# Shared Airflow configuration
# ---------------------------------------------------------------------------
x-airflow-common:
  &airflow-common
  image: apache/airflow:2.8.0
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    # ClickHouse / MinIO creds — needed by PythonOperator tasks that call
    # os.getenv(...) directly in-process (BashOperator env= dicts don't apply here)
    CLICKHOUSE_HOST:         clickhouse
    CLICKHOUSE_HTTP_PORT:    ${CLICKHOUSE_HTTP_PORT:-8123}
    CLICKHOUSE_DB:           ${CLICKHOUSE_DB}
    CLICKHOUSE_USER:         ${CLICKHOUSE_USER}
    CLICKHOUSE_PASSWORD:     ${CLICKHOUSE_PASSWORD}
    S3_ENDPOINT:             ${S3_ENDPOINT}
    AWS_ACCESS_KEY_ID:       ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY:   ${AWS_SECRET_ACCESS_KEY}
    MINIO_BUCKET_BRONZE:     ${MINIO_BUCKET_BRONZE}
    MINIO_BUCKET_SILVER:     ${MINIO_BUCKET_SILVER}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_TOPIC_KLINES_RAW:  ${KAFKA_TOPIC_KLINES_RAW}
    DEFAULT_EXCHANGE:        ${DEFAULT_EXCHANGE}
    DEFAULT_SYMBOLS:         ${DEFAULT_SYMBOLS}
    DEFAULT_KLINE_INTERVAL:  ${DEFAULT_KLINE_INTERVAL}
    DEFAULT_BACKFILL_DAYS:   ${DEFAULT_BACKFILL_DAYS}
    # Extra pip packages installed at container start (slow on first run)
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      apache-airflow-providers-apache-spark
      apache-airflow-providers-amazon
      clickhouse-driver
      clickhouse-connect>=0.6.0,<0.9.0
      boto3
      ccxt>=4.1.0
      pandas>=2.0.0
      pyarrow>=14.0.0
      python-dotenv>=1.0.0
      requests>=2.31.0
      minio>=7.2.0
      pydantic>=2.4.0
      dbt-clickhouse==1.7.1
    TZ: UTC
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - airflow_plugins:/opt/airflow/plugins
    - .:/app:ro
  networks:
    - workbench
  depends_on:
    postgres:
      condition: service_healthy

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # -------------------------------------------------------------------------
  # PostgreSQL — operational metadata database
  # Used by: Airflow scheduler / webserver
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: workbench-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Passed through for use in init script
      AIRFLOW_DB: ${AIRFLOW_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-airflow-db.sh:/docker-entrypoint-initdb.d/10_init-airflow-db.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workbench

  # -------------------------------------------------------------------------
  # ClickHouse — primary analytical serving database
  # Hosts: bronze, silver, gold layers; backs dashboards and dbt
  # -------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: workbench-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT:-1}
      TZ: UTC
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/ddl:/docker-entrypoint-initdb.d:ro
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workbench

  # -------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # Hosts: bronze raw files, silver normalized files, checkpoints
  # External: API=9001, Console=9002  |  Internal: API=9000, Console=9001
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: workbench-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: UTC
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9001}:9000"
      - "${MINIO_CONSOLE_PORT:-9002}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workbench

  # -------------------------------------------------------------------------
  # MinIO init — creates required buckets (runs once, then exits)
  # -------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: workbench-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE:-bronze}
      MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER:-silver}
      MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD:-gold}
      MINIO_BUCKET_CHECKPOINTS: ${MINIO_BUCKET_CHECKPOINTS:-checkpoints}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_BRONZE} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_SILVER} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_GOLD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_CHECKPOINTS} &&
      echo 'All MinIO buckets are ready.'
      "
    networks:
      - workbench

  # -------------------------------------------------------------------------
  # Kafka — real-time event backbone (KRaft mode, no ZooKeeper)
  # -------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: workbench-kafka
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-1}
      CLUSTER_ID: "zbhYrTxaQ6O6s0I5__FCQg"
      TZ: UTC
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - workbench

  # -------------------------------------------------------------------------
  # Spark master
  # -------------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.3
    container_name: workbench-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    user: root
    environment:
      - SPARK_MASTER_HOST=0.0.0.0
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - TZ=UTC
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_HTTP_PORT=${CLICKHOUSE_HTTP_PORT:-8123}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_MASTER_UI_PORT:-8081}:8080"
    volumes:
      - ./spark_jobs:/app/spark_jobs:ro
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - workbench

  # -------------------------------------------------------------------------
  # Spark worker
  # -------------------------------------------------------------------------
  spark-worker:
    image: apache/spark:3.5.3
    container_name: workbench-spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    user: root
    environment:
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-2g}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
      - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-2g}
      - SPARK_WORKER_WEBUI_PORT=8081
      - TZ=UTC
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_HTTP_PORT=${CLICKHOUSE_HTTP_PORT:-8123}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_WORKER_UI_PORT:-8082}:8081"
    networks:
      - workbench

  # -------------------------------------------------------------------------
  # Airflow init — runs DB migration and creates admin user (exits on success)
  # -------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: workbench-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME}" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true
        echo "Airflow init complete."
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Admin}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-User}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    restart: on-failure

  # -------------------------------------------------------------------------
  # Airflow webserver — UI at http://localhost:8080
  # -------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: workbench-airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------------
  # Airflow scheduler
  # -------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: workbench-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$(hostname)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------------
  # Superset — BI / dashboarding layer, UI at http://localhost:8088
  # -------------------------------------------------------------------------
  superset:
    build:
      context: ./docker/superset
      dockerfile: Dockerfile
    container_name: workbench-superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME:-Admin}
      SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME:-User}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      TZ: UTC
    volumes:
      - superset_home:/app/superset_home
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - workbench

  # -------------------------------------------------------------------------
  # WebSocket producer — Binance WS → Kafka klines.raw
  # -------------------------------------------------------------------------
  ws-producer:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: workbench-ws-producer
    command: ["python", "ingestion/realtime/ws_producer.py"]
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_KLINES_RAW:  klines.raw
      DEFAULT_EXCHANGE:        ${DEFAULT_EXCHANGE:-binance}
      DEFAULT_SYMBOLS:         ${DEFAULT_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT}
      DEFAULT_KLINE_INTERVAL:  ${DEFAULT_KLINE_INTERVAL:-1m}
      LOG_LEVEL:               ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED:        "1"
      TZ: UTC
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - workbench
    depends_on:
      kafka:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Streaming consumer — Kafka klines.raw → ClickHouse (rt + bronze + silver + signals)
  # -------------------------------------------------------------------------
  stream-consumer:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: workbench-stream-consumer
    command: ["python", "ingestion/realtime/klines_consumer.py"]
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_KLINES_RAW:  klines.raw
      CLICKHOUSE_HOST:         clickhouse
      CLICKHOUSE_HTTP_PORT:    ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_DB:           ${CLICKHOUSE_DB}
      CLICKHOUSE_USER:         ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD:     ${CLICKHOUSE_PASSWORD}
      LOG_LEVEL:               ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED:        "1"
      TZ: UTC
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - workbench
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # App — Python ingestion and processing jobs
  # Run via: make backfill | make metadata-refresh | make pytest | make lint
  # -------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: workbench-app
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_NATIVE_PORT: ${CLICKHOUSE_NATIVE_PORT:-9000}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
      MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE:-bronze}
      MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER:-silver}
      MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD:-gold}
      DEFAULT_EXCHANGE: ${DEFAULT_EXCHANGE:-binance}
      DEFAULT_SYMBOLS: ${DEFAULT_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT}
      DEFAULT_KLINE_INTERVAL: ${DEFAULT_KLINE_INTERVAL:-1m}
      DEFAULT_BACKFILL_DAYS: ${DEFAULT_BACKFILL_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      TZ: UTC
    volumes:
      - .:/app
    networks:
      - workbench

  # -------------------------------------------------------------------------
  # Jupyter — research notebooks, UI at http://localhost:8888
  # -------------------------------------------------------------------------
  jupyter:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: workbench-jupyter
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888",
              "--no-browser", "--NotebookApp.token=''",
              "--NotebookApp.password=''", "--allow-root"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      MINIO_HOST: minio
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      TZ: UTC
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    working_dir: /app
    networks:
      - workbench
    depends_on:
      clickhouse:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # dbt — analytical modeling (run via: make dbt-build | dbt-test | dbt-docs)
  # -------------------------------------------------------------------------
  dbt:
    build:
      context: ./docker/dbt
      dockerfile: Dockerfile
    container_name: workbench-dbt
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      DBT_PROFILES_DIR: /usr/app/dbt
      TZ: UTC
    volumes:
      - ./dbt:/usr/app/dbt
    working_dir: /usr/app/dbt
    networks:
      - workbench
    depends_on:
      clickhouse:
        condition: service_healthy

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  workbench:
    name: crypto-workbench
    driver: bridge

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  clickhouse_data:
  minio_data:
  kafka_data:
  airflow_logs:
  airflow_plugins:
  superset_home:
